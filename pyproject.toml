[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archflow-v4"
version = "0.1.0"
description = "Bounded architectural agency with controlled state promotion"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["monkeycontrol*"]
exclude = ["tests*", "governance*", "docs*", "tools*"]

[tool.setuptools.package-data]
monkeycontrol = ["hosts/*.ps1", "demos/*.json"]

[tool.archflow]
phase = "P1"
test_command = "python -m unittest discover -s tests -v"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/archflow/tests", "packages/monkeydiagram/tests", "packages/monkeymonitor/tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archflow-v4"
version = "0.1.0"
description = "Bounded architectural agency with controlled state promotion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cad-inspection = ["rhino3dm==8.32.1"]

[tool.setuptools.packages.find]
include = ["archflow*"]
exclude = ["tests*", "governance*", "docs*", "tools*"]

[tool.archflow]
phase = "P1"
test_command = "python -m unittest discover -s tests -v"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archflow-v4"
version = "0.1.0"
description = "Bounded architectural agency with controlled state promotion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cad-inspection = ["rhino3dm==8.32.1"]
# P107 in-process OCCT executor (adapters.cad_execution.execute_occt_export):
# one verified binding, cp312 win_amd64 wheel checked 2026-09-05.  It also
# writes the mesh .3dm preview through rhino3dm.  Pillow rasterises the
# drawing SVG preview to PNG (monkeydiagram.drawing_svg.render_svg_png).
cad-occt = ["cadquery-ocp==7.9.3.1.1", "rhino3dm==8.32.1", "Pillow>=12.3,<13"]
# Shared paper-scene PDF/DXF output; the drawing grammar itself uses stdlib only.
drawings = ["reportlab==5.0.0", "ezdxf==1.4.4", "fonttools==4.64.0"]

[tool.setuptools.packages.find]
include = ["archflow*", "monkeyarch*", "monkeydiagram*", "monkeymonitor*", "apps.shared-web.src"]
exclude = ["tests*", "governance*", "docs*", "tools*"]

[tool.setuptools.package-data]
monkeymonitor = ["web/*", "rates.json"]
"monkeydiagram.documentation" = ["*.json"]
"apps.shared-web.src" = ["appearance.js", "i18n.js", "browserTranslator.js", "base.css"]

[tool.archflow]
phase = "P1"
test_command = "python -m unittest discover -s tests -v"

[tool.pytest.ini_options]
testpaths = ["tests"]

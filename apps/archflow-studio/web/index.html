  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="ArchFlow Studio — proposal-only vertical slice on a bound project"
    />
    <!--
      `lang` says zh-CN and the shell is English. Both are true of what is on
      screen: every string the P108 shell writes is English, and the viewer —
      its status lines, its drop target, its file button — speaks Chinese,
      inherited whole from the viewer this app was built around. The attribute
      is left as it is rather than made half-right by guessing which half wins;
      which language this app speaks is a decision to be made, not a tag to be
      flipped in passing.
    -->
    <title>ArchFlow Studio</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

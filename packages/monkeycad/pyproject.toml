[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeycad"
version = "0.1.0"
description = "CAD execution for ArchFlow geometry programs: the backend-neutral protocol and registry, the OCCT, Rhino and Blender backends, model formats and integration packs."
requires-python = ">=3.12"
# CAD depends on the ArchFlow kernel only. archflow comes from the same checkout
# (packages/archflow) or bundle. It is not a published distribution, so naming it
# here would send pip to an index for it.
dependencies = []

[project.optional-dependencies]
# The in-process OCCT executor (backends.occt.export.execute_occt_export): one verified
# binding, cp312 win_amd64 wheel checked 2026-09-05. It writes the mesh .3dm
# preview through rhino3dm and reads it back with formats.three_dm_inspector.
occt = ["cadquery-ocp==7.9.3.1.1", "rhino3dm==8.32.1"]
# Headless .3dm reading (formats.three_dm_inspector, formats.meshes) without the OCCT kernel.
inspection = ["rhino3dm==8.32.1"]
# The Blender projection's PNG check (backends.blender.projection). Blender itself is an
# executable found on the machine, not a Python requirement.
blender = ["Pillow>=12.3,<13"]

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.pytest.ini_options]: the root one keeps pytest's rootdir at the checkout,
# whose conftest.py puts this checkout's source roots first.

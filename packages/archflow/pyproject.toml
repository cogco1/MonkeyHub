[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archflow"
version = "0.1.0"
description = "The shared ArchFlow kernel: project identity and P036 persistence, architectural facts and semantics, contracts, validation and the CAD/OCCT adapters."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cad-inspection = ["rhino3dm==8.32.1"]
# P107 in-process OCCT executor (adapters.cad_execution.execute_occt_export):
# one verified binding, cp312 win_amd64 wheel checked 2026-09-05.  It also
# writes the mesh .3dm preview through rhino3dm.  Pillow rasterises the
# drawing SVG preview to PNG (monkeydiagram.drawing_svg.render_svg_png).
cad-occt = ["cadquery-ocp==7.9.3.1.1", "rhino3dm==8.32.1", "Pillow>=12.3,<13"]

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.pytest.ini_options]: the root one keeps pytest's rootdir at the checkout,
# whose conftest.py puts this checkout's source roots first.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archflow"
version = "0.1.0"
description = "The shared ArchFlow kernel: project identity and P036 persistence, architectural facts and semantics, contracts and validation."
requires-python = ">=3.12"
# The kernel needs nothing beyond the standard library. The CAD extras it used to carry
# are packages/monkeycad's; Pillow for drawing PNGs is packages/monkeydiagram's.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.pytest.ini_options]: the root one keeps pytest's rootdir at the checkout,
# whose conftest.py puts this checkout's source roots first.

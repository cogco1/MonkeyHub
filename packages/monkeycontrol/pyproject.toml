[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeycontrol"
version = "0.1.0"
description = "Model-independent desktop automation: declared actions located semantically, executed and verified, with receipts in a caller-supplied diagnostics directory."
requires-python = ">=3.12"
# archflow comes from the same checkout (packages/archflow) or bundle. It is not a
# published distribution, so naming it here would send pip to an index for it.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monkeycontrol = ["hosts/*.ps1", "demos/*.json"]

# No [tool.pytest.ini_options]: the root one keeps pytest's rootdir at the checkout,
# whose conftest.py puts this checkout's source roots first.

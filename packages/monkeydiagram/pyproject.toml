[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeydiagram"
version = "0.1.0"
description = "Drawings and diagrams from retained ArchFlow sources: projection, SVG/PNG and paper PDF/DXF output."
requires-python = ">=3.12"
# archflow comes from the same checkout (packages/archflow) or bundle. It is not a
# published distribution, so naming it here would send pip to an index for it.
dependencies = []

[project.optional-dependencies]
# Shared paper-scene PDF/DXF output (rendering.paper).
# Pillow rasterises the drawing SVG preview and the mesh views to PNG
# (rendering.svg.render_svg_png, projection.mesh_views).
drawings = ["reportlab==5.0.0", "ezdxf==1.4.4", "fonttools==4.64.0", "shapely==2.1.2", "Pillow>=12.3,<13"]

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.pytest.ini_options]: the root one keeps pytest's rootdir at the checkout,
# whose conftest.py puts this checkout's source roots first.

[package]
name = "monkeymesh-tcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"

[dependencies]
iroh = { version = "=1.0.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
noq = "=1.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["full"] }

[profile.release]
strip = true

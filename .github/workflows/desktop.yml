name: Windows desktop and browser

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-candidate
    # Both surfaces ship from every main revision, including web-only and Monitor changes.
    # Updating the dedicated release-candidate branch promotes that exact base into a versioned prerelease.

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  MONKEYHUB_RELEASE_SERIES: '0.1'

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare exact build identity
        shell: pwsh
        run: |
          $sourceSha = '${{ github.sha }}'
          "MONKEYHUB_PROMOTED_SHA=$sourceSha" >> $env:GITHUB_ENV
          if ('${{ github.ref }}' -eq 'refs/heads/release-candidate') {
            $version = "$env:MONKEYHUB_RELEASE_SERIES.${{ github.run_number }}"
            if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Invalid release version: $version"
            }
            $cargoToml = 'apps/monkeyhub/desktop/Cargo.toml'
            $cargoLock = 'apps/monkeyhub/desktop/Cargo.lock'
            $toml = Get-Content -LiteralPath $cargoToml -Raw
            $match = [regex]::Match($toml, '(?ms)^\[package\]\s+name = "monkeyarch-desktop"\s+version = "([^"]+)"')
            if (-not $match.Success) { throw 'Cannot find the desktop package version in Cargo.toml' }
            $oldVersion = $match.Groups[1].Value
            $toml = $toml.Remove($match.Groups[1].Index, $match.Groups[1].Length).Insert($match.Groups[1].Index, $version)
            Set-Content -LiteralPath $cargoToml -Value $toml -NoNewline -Encoding utf8
            $lock = Get-Content -LiteralPath $cargoLock -Raw
            $lockPattern = '(?ms)(\[\[package\]\]\s+name = "monkeyarch-desktop"\s+version = ")' + [regex]::Escape($oldVersion) + '"'
            $lockMatch = [regex]::Match($lock, $lockPattern)
            if (-not $lockMatch.Success) { throw "Cannot find monkeyarch-desktop $oldVersion in Cargo.lock" }
            $lock = [regex]::Replace($lock, $lockPattern, ('${1}' + $version + '"'), 1)
            Set-Content -LiteralPath $cargoLock -Value $lock -NoNewline -Encoding utf8

            git config user.name 'MonkeyHub Release Bot'
            git config user.email 'release-bot@users.noreply.github.com'
            $stamp = git show -s --format=%cI $sourceSha
            $env:GIT_AUTHOR_DATE = $stamp
            $env:GIT_COMMITTER_DATE = $stamp
            git add -- $cargoToml $cargoLock
            git commit -m "release: v$version"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $sourceSha = (git rev-parse HEAD).Trim()
            "MONKEYHUB_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          }
          "MONKEYHUB_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          Write-Host "Promoted base: ${{ github.sha }}"
          Write-Host "Build source: $sourceSha"
          if ($env:MONKEYHUB_RELEASE_VERSION) { Write-Host "Release version: $env:MONKEYHUB_RELEASE_VERSION" }
      - name: Rust toolchain
        run: rustup show
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/mhp/cache
          key: windows-desktop-release-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-desktop-release-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}-
            windows-desktop-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Build complete desktop distribution from this commit
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $root = Join-Path $env:RUNNER_TEMP 'mhp'
          $env:CARGO_HOME = Join-Path $HOME '.cargo'
          python tools/package_monkeyapps.py --source-ref HEAD --desktop --staging-dir "$root/staging" --output-dir "$root/output" --cache-dir "$root/cache"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = Get-ChildItem -LiteralPath "$root/staging" -Directory | Select-Object -First 1
          "PACKAGE_BUILD=$($build.FullName)" >> $env:GITHUB_ENV
      - name: Normalize release version across package evidence
        if: github.ref == 'refs/heads/release-candidate'
        shell: pwsh
        env:
          # This script is written into RUNNER_TEMP, so sys.path[0] is that temp
          # directory and the checkout is not importable. The release evidence is
          # derived by the packaging owner, so put the checkout on the path.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mhp'
          $script = Join-Path $root 'normalize-release.py'
          @'
          import json
          import os
          from pathlib import Path
          import shutil
          import zipfile

          from tools import package_monkeyapps as builder

          root = Path(os.environ["RUNNER_TEMP"]) / "mhp"
          build = Path(os.environ["PACKAGE_BUILD"])
          source = build / "source"
          output = root / "output"
          version = os.environ["MONKEYHUB_RELEASE_VERSION"]
          source_sha = os.environ["MONKEYHUB_SOURCE_SHA"]

          bundles = [path for path in build.iterdir()
                     if path.is_dir() and path.name.startswith("MonkeyHub-")
                     and path.name.endswith("-windows-x64")]
          if len(bundles) != 1:
              raise SystemExit(f"Expected exactly one assembled MonkeyHub bundle, found: {bundles}")
          bundle = bundles[0]
          target_bundle = build / f"MonkeyHub-{version}-windows-x64"
          if target_bundle.exists() and target_bundle != bundle:
              raise SystemExit(f"Versioned bundle already exists: {target_bundle}")
          if bundle != target_bundle:
              bundle.rename(target_bundle)
              bundle = target_bundle

          build_info_path = bundle / "build-info.json"
          build_info = json.loads(build_info_path.read_text(encoding="utf-8"))
          if build_info.get("sourceCommit") != source_sha:
              raise SystemExit("build-info sourceCommit does not match the exact release source")
          desktop = build_info.get("desktop") or {}
          if desktop.get("version") != version:
              raise SystemExit("desktop version does not match the promoted release version")
          build_info["releaseVersion"] = version
          build_info_path.write_text(json.dumps(build_info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          sbom_document = builder.sbom_document(source, bundle, build_info, version)
          bundle_sbom = bundle / builder.SBOM_NAME
          bundle_sbom.write_text(json.dumps(sbom_document, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          zip_path = build / f"{bundle.name}-candidate.zip"
          if zip_path.exists():
              raise SystemExit(f"Versioned archive already exists in staging: {zip_path}")
          with zipfile.ZipFile(zip_path, "x", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(bundle.rglob("*")):
                  if path.is_file():
                      archive.write(path, (Path(bundle.name) / path.relative_to(bundle)).as_posix())

          for path in output.iterdir():
              if path.is_file():
                  path.unlink()
          final = output / zip_path.name
          checksum = output / f"{final.name}.sha256"
          sbom = output / f"{bundle.name}.cyclonedx.json"
          manifest = output / f"{final.name}.release-manifest.json"
          shutil.copy2(zip_path, final)
          checksum.write_text(f"{builder.sha256(final)}  {final.name}\n", encoding="utf-8")
          shutil.copy2(bundle_sbom, sbom)
          manifest_document = builder.release_manifest(
              build_info, version, bundle.name, build_info_path, final,
              (final, checksum, sbom), sbom,
          )
          manifest.write_text(json.dumps(manifest_document, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          problems = builder.verify_release(manifest)
          if problems:
              raise SystemExit("Normalized release failed verification: " + "; ".join(problems))
          if manifest_document["release"]["version"] != version:
              raise SystemExit("ReleaseManifest version does not match promoted release")
          if manifest_document["artifactPrefix"] != bundle.name:
              raise SystemExit("ReleaseManifest artifactPrefix does not match versioned bundle")
          if sbom_document["metadata"]["component"]["version"] != version:
              raise SystemExit("SBOM component version does not match promoted release")
          expected = {
              final.name,
              checksum.name,
              sbom.name,
              manifest.name,
          }
          actual = {path.name for path in output.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Release directory is not a closed four-file set: {sorted(actual)}")
          print(f"Normalized release {version}: {final.name}")
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          python $script
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify release desktop version
        if: github.ref == 'refs/heads/release-candidate'
        shell: pwsh
        run: |
          $identity = & "$env:PACKAGE_BUILD/desktop-target/release/MonkeyArch.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $parsed = $identity | ConvertFrom-Json
          if ($parsed.version -ne $env:MONKEYHUB_RELEASE_VERSION) {
            throw "Desktop version $($parsed.version) does not match release $env:MONKEYHUB_RELEASE_VERSION"
          }
          if ($parsed.sourceRevision -ne $env:MONKEYHUB_SOURCE_SHA) {
            throw "Desktop source $($parsed.sourceRevision) does not match release source $env:MONKEYHUB_SOURCE_SHA"
          }
      - name: Test host boundaries from the packaged snapshot
        shell: pwsh
        run: |
          Push-Location "$env:PACKAGE_BUILD/source/apps/monkeyhub/desktop"
          $env:ARCHFLOW_SOURCE_REVISION = $env:MONKEYHUB_SOURCE_SHA
          cargo test --locked --release --target-dir "$env:PACKAGE_BUILD/desktop-target"
          $result = $LASTEXITCODE
          Pop-Location
          exit $result
      - name: Extract and install the complete ZIP in an isolated user environment
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mhp'
          $zip = Get-ChildItem -LiteralPath "$root/output" -Filter '*.zip' | Select-Object -First 1
          $expected = ((Get-Content -LiteralPath "$($zip.FullName).sha256" -Raw) -split ' ')[0]
          if ((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$root/extracted"
          $package = Get-ChildItem -LiteralPath "$root/extracted" -Directory | Select-Object -First 1
          $installed = Join-Path $root 'installed/MonkeyArch'
          $env:LOCALAPPDATA = Join-Path $root 'installer-user'
          & "$($package.FullName)/apps/monkeyhub/installer/install.ps1" -InstallDirectory $installed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MONKEYARCH_PACKAGE_ROOT=$($package.FullName)" >> $env:GITHUB_ENV
          "MONKEYARCH_INSTALLED_ROOT=$installed" >> $env:GITHUB_ENV
          "MONKEYARCH_DESKTOP_EXE=$installed/MonkeyArch.exe" >> $env:GITHUB_ENV
      - name: Installed native lifecycle, reinstall and isolated project restart
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          & "$env:MONKEYARCH_INSTALLED_ROOT/_runtime/python/python.exe" -B apps/monkeyhub/desktop/tests/test_runtime.py -v
          exit $LASTEXITCODE
      - name: Verify installed release identity
        if: github.ref == 'refs/heads/release-candidate'
        shell: pwsh
        run: |
          $identity = (& "$env:MONKEYARCH_DESKTOP_EXE" --version) | ConvertFrom-Json
          if ($identity.version -ne $env:MONKEYHUB_RELEASE_VERSION) {
            throw "Installed desktop version $($identity.version) does not match release $env:MONKEYHUB_RELEASE_VERSION"
          }
          if ($identity.sourceRevision -ne $env:MONKEYHUB_SOURCE_SHA) {
            throw "Installed source $($identity.sourceRevision) does not match release source $env:MONKEYHUB_SOURCE_SHA"
          }
      - name: Keep complete review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyArch-package-${{ github.sha }}
          path: ${{ runner.temp }}/mhp/output/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Keep review executable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonkeyArch-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/mhp/installed/MonkeyArch/MonkeyArch.exe
          retention-days: 7
          if-no-files-found: warn
      - name: Package and native shortcut selection
        run: python -m unittest discover -s tests -p test_package_monkeyapps.py -v
      - name: Publish versioned GitHub prerelease
        if: github.ref == 'refs/heads/release-candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mhp'
          $tag = "v$env:MONKEYHUB_RELEASE_VERSION"
          $manifest = Get-ChildItem -LiteralPath "$root/output" -Filter '*.release-manifest.json'
          if (@($manifest).Count -ne 1) { throw 'Expected exactly one release manifest.' }
          python tools/package_monkeyapps.py --verify $manifest.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $document = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          if ($document.release.version -ne $env:MONKEYHUB_RELEASE_VERSION) {
            throw 'ReleaseManifest version differs from the GitHub release version.'
          }
          if ($document.release.sourceCommit -ne $env:MONKEYHUB_SOURCE_SHA) {
            throw 'ReleaseManifest source commit differs from the exact packaged source.'
          }
          $assets = @(Get-ChildItem -LiteralPath "$root/output" -File)
          if ($assets.Count -ne 4) { throw "Expected exactly four release assets, found $($assets.Count)." }

          $remoteTag = (git ls-remote --tags origin "refs/tags/$tag").Trim()
          if ($remoteTag) {
            $remoteSha = ($remoteTag -split '\s+')[0]
            if ($remoteSha -ne $env:MONKEYHUB_SOURCE_SHA) {
              throw "$tag already points to $remoteSha, expected $env:MONKEYHUB_SOURCE_SHA"
            }
          } else {
            git tag $tag $env:MONKEYHUB_SOURCE_SHA
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $published = Join-Path $root 'published-release'
            New-Item -ItemType Directory -Path $published -Force | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $published
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $local = @{}
            foreach ($file in $assets) {
              $local[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            $remote = @{}
            foreach ($file in Get-ChildItem -LiteralPath $published -File) {
              $remote[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            if ($local.Count -ne $remote.Count) {
              throw "$tag already exists with a different asset count."
            }
            foreach ($name in $local.Keys) {
              if (-not $remote.ContainsKey($name) -or $remote[$name] -ne $local[$name]) {
                throw "$tag already exists but asset $name is missing or has different bytes."
              }
            }
            Write-Host "$tag already exists with byte-identical assets; treating rerun as idempotent success."
            exit 0
          }

          $assetPaths = $assets | ForEach-Object { $_.FullName }
          $notes = @"
          Automated Windows candidate release.

          - Version: $tag
          - Release source: $env:MONKEYHUB_SOURCE_SHA
          - Promoted main/base commit: $env:MONKEYHUB_PROMOTED_SHA
          - Trust: candidate-unsigned
          - Package ZIP, ReleaseManifest@1, CycloneDX SBOM, and MonkeyArch.exe report one release version.
          - This is a prerelease for clean-machine acceptance; it is not a signed production release.
          "@
          gh release create $tag $assetPaths --repo $env:GITHUB_REPOSITORY --prerelease --title "MonkeyHub $tag · Windows candidate" --notes $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/mhp/cache
          key: windows-desktop-release-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}-${{ github.sha }}

name: Windows desktop and browser

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-desktop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify73:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt
      - name: Install Study dependencies
        run: python -m pip install -e . -r apps/archflow-studio/api/requirements.txt httpx2 pytest
      - name: Study archive compatibility tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest apps/archflow-studio/api/tests/test_study.py -q
      - name: Architecture firewall
        run: python tools/archcheck.py
      - name: Diff whitespace smoke
        run: git diff --check origin/codex/73-study-evidence-substrate...HEAD
name: Windows desktop and browser

on:
  workflow_dispatch:
  # A pull request runs the same build, Rust tests, packaging, ZIP checksum,
  # isolated install and installed runtime suite, so the desktop surface is
  # verified before merge and not only afterwards.
  pull_request:
  push:
    branches:
      - main
      - release-candidate
    # Both surfaces ship from every main revision, including web-only and Monitor changes.
    # Updating the dedicated release-candidate branch promotes that exact base into a versioned prerelease.

# Building, testing, packaging and installing need nothing but the checkout.
# Only the separate publish job below raises this, and only for a real
# release-candidate push; a pull request never receives a writable token.
permissions:
  contents: read

# Only a pull request supersedes its own earlier run. Pushes to main or
# release-candidate and manual runs each get a unique group, so a newer commit
# never cancels or queues out a packaging run that is still producing a candidate.
concurrency:
  group: >-
    windows-desktop-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MONKEYHUB_RELEASE_SERIES: '0.1'
  # One source of truth for the release path. A pull request targeting
  # release-candidate reports refs/pull/<n>/merge, so it is never a release.
  MONKEYHUB_RELEASE_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release-candidate' }}

jobs:
  desktop:
    # Stable, unique check name for branch protection.
    name: Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release_version: ${{ steps.identity.outputs.release_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # This job builds and runs pull request code. Leaving the token in
          # .git/config would hand every later step a configured remote; nothing
          # here talks to the remote, so it is dropped.
          persist-credentials: false
      - name: Prepare exact build identity
        id: identity
        shell: pwsh
        run: |
          $sourceSha = '${{ github.sha }}'
          $version = ''
          if ($env:MONKEYHUB_RELEASE_PUSH -eq 'true') {
            $version = "$env:MONKEYHUB_RELEASE_SERIES.${{ github.run_number }}"
            if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Invalid release version: $version"
            }
            $cargoToml = 'apps/monkeyhub/desktop/Cargo.toml'
            $cargoLock = 'apps/monkeyhub/desktop/Cargo.lock'
            $toml = Get-Content -LiteralPath $cargoToml -Raw
            $match = [regex]::Match($toml, '(?ms)^\[package\]\s+name = "monkeyarch-desktop"\s+version = "([^"]+)"')
            if (-not $match.Success) { throw 'Cannot find the desktop package version in Cargo.toml' }
            $oldVersion = $match.Groups[1].Value
            $toml = $toml.Remove($match.Groups[1].Index, $match.Groups[1].Length).Insert($match.Groups[1].Index, $version)
            Set-Content -LiteralPath $cargoToml -Value $toml -NoNewline -Encoding utf8
            $lock = Get-Content -LiteralPath $cargoLock -Raw
            $lockPattern = '(?ms)(\[\[package\]\]\s+name = "monkeyarch-desktop"\s+version = ")' + [regex]::Escape($oldVersion) + '"'
            $lockMatch = [regex]::Match($lock, $lockPattern)
            if (-not $lockMatch.Success) { throw "Cannot find monkeyarch-desktop $oldVersion in Cargo.lock" }
            $lock = [regex]::Replace($lock, $lockPattern, ('${1}' + $version + '"'), 1)
            Set-Content -LiteralPath $cargoLock -Value $lock -NoNewline -Encoding utf8

            git config user.name 'MonkeyHub Release Bot'
            git config user.email 'release-bot@users.noreply.github.com'
            $stamp = git show -s --format=%cI $sourceSha
            $env:GIT_AUTHOR_DATE = $stamp
            $env:GIT_COMMITTER_DATE = $stamp
            git add -- $cargoToml $cargoLock
            git commit -m "release: v$version"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $sourceSha = (git rev-parse HEAD).Trim()
            # Carry the exact built commit to the publish job as objects rather
            # than rebuilding it there, so the pushed tag is the commit that was
            # compiled, tested and installed in this job.
            git bundle create "$env:RUNNER_TEMP/release-commit.bundle" HEAD --not '${{ github.sha }}'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "MONKEYHUB_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          }
          "MONKEYHUB_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build source: $sourceSha"
          if ($version) { Write-Host "Release version: $version" }
      - name: Keep the release commit for the publish job
        if: env.MONKEYHUB_RELEASE_PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyArch-release-commit-${{ github.sha }}
          path: ${{ runner.temp }}/release-commit.bundle
          retention-days: 7
          if-no-files-found: error
      - name: Rust toolchain
        run: rustup show
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/mhp/cache
          key: windows-desktop-release-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}-${{ github.sha }}
          # The last key carries no hash on purpose. This cache also holds the
          # pip, CPython and npm downloads, which do not depend on Cargo.lock;
          # without it a pull request that edits Cargo.lock re-downloads
          # everything and risks the 60 minute timeout.
          restore-keys: |
            windows-desktop-release-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}-
            windows-desktop-release-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Build complete desktop distribution from this commit
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $root = Join-Path $env:RUNNER_TEMP 'mhp'
          $env:CARGO_HOME = Join-Path $HOME '.cargo'
          python tools/package_monkeyapps.py --source-ref HEAD --desktop --staging-dir "$root/staging" --output-dir "$root/output" --cache-dir "$root/cache"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = Get-ChildItem -LiteralPath "$root/staging" -Directory | Select-Object -First 1
          "PACKAGE_BUILD=$($build.FullName)" >> $env:GITHUB_ENV
      - name: Verify release desktop version
        if: env.MONKEYHUB_RELEASE_PUSH == 'true'
        shell: pwsh
        run: |
          $identity = & "$env:PACKAGE_BUILD/desktop-target/release/MonkeyArch.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $parsed = $identity | ConvertFrom-Json
          if ($parsed.version -ne $env:MONKEYHUB_RELEASE_VERSION) {
            throw "Desktop version $($parsed.version) does not match release $env:MONKEYHUB_RELEASE_VERSION"
          }
          if ($parsed.sourceRevision -ne $env:MONKEYHUB_SOURCE_SHA) {
            throw "Desktop source $($parsed.sourceRevision) does not match release source $env:MONKEYHUB_SOURCE_SHA"
          }
      - name: Test host boundaries from the packaged snapshot
        shell: pwsh
        run: |
          Push-Location "$env:PACKAGE_BUILD/source/apps/monkeyhub/desktop"
          $env:ARCHFLOW_SOURCE_REVISION = $env:MONKEYHUB_SOURCE_SHA
          cargo test --locked --release --target-dir "$env:PACKAGE_BUILD/desktop-target"
          $result = $LASTEXITCODE
          Pop-Location
          exit $result
      - name: Extract and install the complete ZIP in an isolated user environment
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mhp'
          $zip = Get-ChildItem -LiteralPath "$root/output" -Filter '*.zip' | Select-Object -First 1
          $expected = ((Get-Content -LiteralPath "$($zip.FullName).sha256" -Raw) -split ' ')[0]
          if ((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$root/extracted"
          $package = Get-ChildItem -LiteralPath "$root/extracted" -Directory | Select-Object -First 1
          $installed = Join-Path $root 'installed/MonkeyArch'
          $env:LOCALAPPDATA = Join-Path $root 'installer-user'
          & "$($package.FullName)/apps/monkeyhub/installer/install.ps1" -InstallDirectory $installed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MONKEYARCH_PACKAGE_ROOT=$($package.FullName)" >> $env:GITHUB_ENV
          "MONKEYARCH_INSTALLED_ROOT=$installed" >> $env:GITHUB_ENV
          "MONKEYARCH_DESKTOP_EXE=$installed/MonkeyArch.exe" >> $env:GITHUB_ENV
      - name: Installed native lifecycle, reinstall and isolated project restart
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          # The suite skips itself when MONKEYARCH_DESKTOP_EXE is missing, which
          # would report a green gate having run nothing.
          if (-not $env:MONKEYARCH_DESKTOP_EXE -or -not (Test-Path -LiteralPath $env:MONKEYARCH_DESKTOP_EXE)) {
            throw 'The installed MonkeyArch.exe is missing; the runtime suite would skip instead of running'
          }
          & "$env:MONKEYARCH_INSTALLED_ROOT/_runtime/python/python.exe" -B apps/monkeyhub/desktop/tests/test_runtime.py -v
          exit $LASTEXITCODE
      - name: Verify installed release identity
        if: env.MONKEYHUB_RELEASE_PUSH == 'true'
        shell: pwsh
        run: |
          $identity = (& "$env:MONKEYARCH_DESKTOP_EXE" --version) | ConvertFrom-Json
          if ($identity.version -ne $env:MONKEYHUB_RELEASE_VERSION) {
            throw "Installed desktop version $($identity.version) does not match release $env:MONKEYHUB_RELEASE_VERSION"
          }
          if ($identity.sourceRevision -ne $env:MONKEYHUB_SOURCE_SHA) {
            throw "Installed source $($identity.sourceRevision) does not match release source $env:MONKEYHUB_SOURCE_SHA"
          }
      - name: Keep complete review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyArch-package-${{ github.sha }}
          path: ${{ runner.temp }}/mhp/output/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Keep review executable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonkeyArch-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/mhp/installed/MonkeyArch/MonkeyArch.exe
          retention-days: 7
          if-no-files-found: warn
      - name: Package and native shortcut selection
        run: python -m unittest discover -s tests -p test_package_monkeyapps.py -v
      # A pull request reads the shared cache but never writes it: its key would
      # be scoped to the pull request ref and only evict entries main still uses.
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/mhp/cache
          key: windows-desktop-release-${{ hashFiles('apps/monkeyhub/desktop/Cargo.lock') }}-${{ github.sha }}

  publish:
    # Separate job because GitHub Actions cannot make `permissions` conditional:
    # this is the only place in the workflow that holds a writable token, and it
    # exists only for a pushed release-candidate revision.
    name: Windows release publish
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-candidate'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Each run has its own release version and workflow concurrency group.
    # Do not add a shared pending queue that can discard an earlier release.
    env:
      MONKEYHUB_RELEASE_VERSION: ${{ needs.desktop.outputs.release_version }}
      MONKEYHUB_SOURCE_SHA: ${{ needs.desktop.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: MonkeyArch-release-commit-${{ github.sha }}
          path: ${{ runner.temp }}/release-commit
      - uses: actions/download-artifact@v4
        with:
          name: MonkeyArch-package-${{ github.sha }}
          path: ${{ runner.temp }}/output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit only the verified release commit
        shell: pwsh
        run: |
          $base = '${{ github.sha }}'
          $expected = $env:MONKEYHUB_SOURCE_SHA
          $version = $env:MONKEYHUB_RELEASE_VERSION
          if (-not $expected -or -not $version) { throw 'The build job reported no release identity' }
          # The version crossed a job boundary and is about to become a ref name.
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release version: $version" }
          if ($expected -notmatch '^[0-9a-f]{40}$') { throw "Invalid release source: $expected" }

          $bundle = Join-Path $env:RUNNER_TEMP 'release-commit/release-commit.bundle'
          git bundle verify $bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git fetch --no-tags $bundle HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $fetched = (git rev-parse FETCH_HEAD).Trim()
          if ($fetched -ne $expected) { throw "Bundled commit $fetched is not the built source $expected" }

          # The release commit must be one commit directly on the pushed branch
          # head, changing nothing but the desktop version it was built from.
          $parents = (git rev-list --parents -n 1 $expected).Trim() -split '\s+'
          if ($parents.Length -ne 2 -or $parents[1] -ne $base) {
            throw "Release commit $expected is not a single commit on $base"
          }
          $changed = @(git diff --name-only $base $expected | Where-Object { $_ }) | Sort-Object
          $allowed = @('apps/monkeyhub/desktop/Cargo.lock', 'apps/monkeyhub/desktop/Cargo.toml')
          if (($changed -join ',') -ne ($allowed -join ',')) {
            throw "Release commit changes $($changed -join ', ')"
          }
          $author = (git show -s --format='%an <%ae>|%cn <%ce>|%s' $expected).Trim()
          $identity = 'MonkeyHub Release Bot <release-bot@users.noreply.github.com>'
          if ($author -ne "$identity|$identity|release: v$version") {
            throw "Release commit was not written by the release bot: $author"
          }
          $toml = (git show "${expected}:apps/monkeyhub/desktop/Cargo.toml") -join "`n"
          $tomlPattern = '(?ms)^\[package\]\s+name = "monkeyarch-desktop"\s+version = "' + [regex]::Escape($version) + '"'
          if ($toml -notmatch $tomlPattern) { throw "Release commit does not declare desktop version $version" }
          $lock = (git show "${expected}:apps/monkeyhub/desktop/Cargo.lock") -join "`n"
          $lockPattern = '(?ms)\[\[package\]\]\s+name = "monkeyarch-desktop"\s+version = "' + [regex]::Escape($version) + '"'
          if ($lock -notmatch $lockPattern) { throw "Release commit does not lock desktop version $version" }
      - name: Admit only the verified release assets
        shell: pwsh
        run: |
          $expected = $env:MONKEYHUB_SOURCE_SHA
          $version = $env:MONKEYHUB_RELEASE_VERSION
          $root = Join-Path $env:RUNNER_TEMP 'output'
          $manifests = @(Get-ChildItem -LiteralPath $root -Filter '*.release-manifest.json' -File)
          if (-not $manifests) { throw 'The build job published no ReleaseManifest@1' }
          foreach ($manifest in $manifests) {
            # The assets travelled through an artifact. Re-run the packaging
            # owner's own read-only check rather than re-hashing them here.
            python tools/package_monkeyapps.py --verify $manifest.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $document = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
            if ($document.release.sourceCommit -ne $expected) {
              throw "$($manifest.Name) was built from $($document.release.sourceCommit), not $expected"
            }
            if ($document.release.version -ne $version) {
              throw "$($manifest.Name) declares version $($document.release.version), not $version"
            }
          }
          # A matching manifest establishes that these files are the set this
          # unsigned manifest closes over, and that they name the release commit
          # this job is about to tag. It does not establish who built them; only
          # a signature or build attestation could.
      - name: Publish versioned GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'output'
          $tag = "v$env:MONKEYHUB_RELEASE_VERSION"
          $remoteTag = (git ls-remote --tags origin "refs/tags/$tag").Trim()
          if ($remoteTag) {
            $remoteSha = ($remoteTag -split '\s+')[0]
            if ($remoteSha -ne $env:MONKEYHUB_SOURCE_SHA) {
              throw "$tag already points to $remoteSha, expected $env:MONKEYHUB_SOURCE_SHA"
            }
          } else {
            git tag $tag $env:MONKEYHUB_SOURCE_SHA
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already has a GitHub Release; leaving it unchanged."
            exit 0
          }
          $assets = Get-ChildItem -LiteralPath $root -File | ForEach-Object { $_.FullName }
          if (-not $assets) { throw 'No release assets were produced.' }
          $notes = @"
          Automated Windows candidate release.

          - Version: $tag
          - Source: $env:MONKEYHUB_SOURCE_SHA
          - Base promoted from: ${{ github.sha }}
          - Trust: candidate-unsigned
          - Includes ReleaseManifest@1, SHA-256 sidecar, and CycloneDX 1.6 SBOM.
          - This is a prerelease for clean-machine acceptance; it is not a signed production release.
          "@
          gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --prerelease --title "MonkeyHub $tag · Windows candidate" --notes $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

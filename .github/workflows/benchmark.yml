name: Daily benchmark

# Measures MonkeyHub from source on the same scenarios every day (GH-547) and
# keeps the results on the orphan branch benchmark-data, never on main:
#   - every day at 20:30 UTC (after the 19:00 UTC nightly promotion) and on
#     manual dispatch, on Ubuntu and Windows; on main the results are
#     published and judged, and once SCHEDULED_ISSUES is on, each flagged
#     metric opens or updates one type:perf issue;
#   - a pull request that touches the benchmark's own files measures once and
#     shows the table, and publishes nothing.
# It is not a required check. See docs/development/benchmarks.md.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: Samples of each scenario at each project size
        type: string
        default: "5"
      budget_override:
        description: "METRIC=VALUE replaces one budget for this run only (with issues on, hub_start.warm=1 tests the perf issue path)"
        type: string
        default: ""
      issues:
        description: Open or update a type:perf issue for each flagged metric
        type: boolean
        default: false
  pull_request:
    paths:
      - tools/benchmarks/daily_benchmark.py
      - tools/benchmarks/benchmark_data.py
      - tools/benchmarks/budgets.json
      - tools/tests/test_daily_benchmark.py
      - tools/tests/test_benchmark_data.py
      - .github/workflows/benchmark.yml

permissions:
  contents: read

env:
  # Whether a scheduled run opens and updates perf issues. Off until the budgets
  # come from CI: after about 7 days of results, re-seed budgets.json from the
  # CI medians per runner and turn this on (docs/development/benchmarks.md).
  SCHEDULED_ISSUES: "false"

# A pull request supersedes its own earlier run; runs on main queue behind each
# other and are never cancelled halfway.
concurrency:
  group: >-
    benchmark-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The same setup as the projection job in verify.yml.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeycad/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            services/project-runtime/requirements.txt

      - name: Install API and test dependencies
        run: python -m pip install -e packages/archflow -e "packages/monkeycad[inspection]" -e packages/monkeyarch -e packages/monkeydiagram -e packages/monkeymonitor -e packages/monkeycontrol -r services/project-runtime/requirements.txt -r apps/monkeyhub/api/requirements.txt httpx2

      # The generator lives with the Runtime's tests, which a repository tool may
      # not import: as in the projection job, the workflow builds the projects in
      # the Runtime's directory and hands them to the harness.
      - name: Generate the synthetic projects
        shell: bash
        working-directory: services/project-runtime
        env:
          PYTHONPATH: ${{ github.workspace }}${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/packages/archflow/src${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/services/project-runtime/src
        run: |
          python - <<'PY'
          import os, pathlib, time
          from tests.synthetic_project import build_synthetic_project
          root = pathlib.Path(os.environ["RUNNER_TEMP"], "benchmark", "projects")
          for runs in (30, 150):
              started = time.perf_counter()
              project = build_synthetic_project(root / str(runs), project_id=f"synthetic-bench-{runs}", runs=runs)
              print(f"{project}: {runs} runs in {time.perf_counter() - started:.0f} s", flush=True)
          PY

      - name: Measure
        shell: bash
        env:
          SAMPLES: ${{ inputs.samples || '5' }}
          BUDGET_OVERRIDE: ${{ inputs.budget_override }}
        run: >-
          python tools/benchmarks/daily_benchmark.py run
          --project "30=$RUNNER_TEMP/benchmark/projects/30/synthetic-bench-30"
          --project "150=$RUNNER_TEMP/benchmark/projects/150/synthetic-bench-150"
          --samples "$SAMPLES"
          --out "$RUNNER_TEMP/benchmark/result-${{ runner.os }}.json"
          --summary "$RUNNER_TEMP/benchmark/summary.md"
          --work "$RUNNER_TEMP/benchmark/work"
          ${BUDGET_OVERRIDE:+--budget-override "$BUDGET_OVERRIDE"}

      - name: Benchmark summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/benchmark/summary.md" ]; then
            cat "$RUNNER_TEMP/benchmark/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The benchmark wrote no summary; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result-${{ runner.os }}
          path: ${{ runner.temp }}/benchmark/result-${{ runner.os }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the Hub logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs-${{ runner.os }}
          path: ${{ runner.temp }}/benchmark/work/logs
          if-no-files-found: ignore
          retention-days: 7

  # Only a scheduled or dispatched run on main writes anything: the results to
  # benchmark-data, and the issues of the metrics they flag.
  publish:
    name: Publish to benchmark-data
    needs: measure
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    concurrency:
      group: benchmark-data
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      # The data branch is checked out as a worktree of this checkout, whose
      # token pushes it; a missing branch starts as an orphan.
      - name: Publish and judge
        shell: bash
        env:
          BUDGET_OVERRIDE: ${{ inputs.budget_override }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          results=("$RUNNER_TEMP"/results/*.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "No benchmark produced a result; nothing is published." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          args=()
          for file in "${results[@]}"; do args+=(--result "$file"); done
          python tools/benchmarks/benchmark_data.py publish --repo "$GITHUB_WORKSPACE" \
            --data-dir "$RUNNER_TEMP/benchmark-data" "${args[@]}" --push \
            --author "github-actions[bot]" "41898282+github-actions[bot]@users.noreply.github.com" \
            --flags-out "$RUNNER_TEMP/flags.json" --issues-out "$RUNNER_TEMP/issues.json" --run-url "$RUN_URL" \
            ${BUDGET_OVERRIDE:+--budget-override "$BUDGET_OVERRIDE"} | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Trend: ${{ github.server_url }}/${{ github.repository }}/blob/benchmark-data/trend.md" >> "$GITHUB_STEP_SUMMARY"

      # One open type:perf issue per metric, found by its exact title: a metric
      # flagged again gets a comment on its open issue, never a second issue.
      # A scheduled run does so only with SCHEDULED_ISSUES on, a dispatch only
      # with its issues input; otherwise the flags stay in the summary above.
      - name: Open or update perf issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPEN_ISSUES: >-
            ${{ (github.event_name == 'schedule' && env.SCHEDULED_ISSUES == 'true')
            || (github.event_name == 'workflow_dispatch' && inputs.issues) }}
        run: |
          plan="$RUNNER_TEMP/issues.json"
          count=$(jq length "$plan")
          if [ "$count" -eq 0 ]; then
            echo "No metric is flagged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$OPEN_ISSUES" != "true" ]; then
            echo "Perf issues are off for this run: $count flagged metrics are listed above and no issue is opened or updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue list --state open --label type:perf --limit 500 --json number,title > "$RUNNER_TEMP/open-issues.json"
          for index in $(seq 0 $((count - 1))); do
            title=$(jq -r ".[$index].title" "$plan")
            jq -r ".[$index].body" "$plan" > "$RUNNER_TEMP/issue-body.md"
            number=$(TITLE="$title" jq -r 'map(select(.title == env.TITLE)) | first | .number // empty' "$RUNNER_TEMP/open-issues.json")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$RUNNER_TEMP/issue-body.md"
              echo "Updated #$number: $title" >> "$GITHUB_STEP_SUMMARY"
            else
              url=$(gh issue create --title "$title" --label type:perf --body-file "$RUNNER_TEMP/issue-body.md")
              echo "Opened $url: $title" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

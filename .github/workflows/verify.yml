                  )
                  self.assertEqual(old.status_code, 200, old.text)
                  self.assertEqual(old.json()["hypotheses"], [])

          ''' + insert_anchor
          treplace(insert_anchor, insert_tests)

          test_path.write_text(tests, encoding="utf-8")

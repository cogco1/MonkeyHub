name: ArchFlow Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: >-
    archflow-verify-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap rebased GH-128 module registry
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 129
        run: |
          git checkout "${{ github.head_ref }}"
          git show origin/main:governance/module_registry.json > governance/module_registry.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('governance/module_registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          modules = {item['module_id']: item for item in data['modules']}

          studio = modules['studio.shell']
          studio['purpose'] = studio['purpose'].replace('with the Hub and Monitor consumers', 'with the Hub consumer')
          studio['used_by'] = [item for item in studio.get('used_by', []) if not item.startswith('monkeymonitor/web/')]
          if isinstance(studio.get('notes'), str):
              studio['notes'] = studio['notes'].replace('for the real Hub and Monitor consumers', 'for the real Hub consumer')

          monitor = modules['monkeymonitor']
          monitor['purpose'] = 'Engineering usage, trace, exact decimal token pricing and bounded algorithm recommendations for Hub/Studio observations and explicit Codex session files; MonkeyHub owns the visible Usage page.'
          owns = []
          for item in monitor.get('owns', []):
              if item.startswith('Read-only HTTP delivery of the four shared appearance'):
                  continue
              if item.startswith('Loopback MonkeyMonitor UI and CLI'):
                  owns.append('Loopback MonkeyMonitor diagnostic API and CLI, and optional usage.jsonl diagnostic append/read under a caller-supplied noncanonical data directory')
              else:
                  owns.append(item)
          monitor['owns'] = owns
          monitor['does_not_own'] = [
              ('The product browser shell, navigation, appearance or Usage-page rendering - MonkeyHub owns that UI and consumes this module through its bounded loopback API'
               if item.startswith('Shared browser appearance') else item)
              for item in monitor.get('does_not_own', [])
          ]
          monitor['public_api'] = [item for item in monitor.get('public_api', []) if not item.startswith('GET /shared/')]
          for item in ('GET /api/events', 'GET /api/rates', 'POST /api/quote'):
              if item not in monitor['public_api']:
                  monitor['public_api'].append(item)
          monitor['used_by'] = [item for item in monitor.get('used_by', []) if not item.startswith('monkeymonitor/web/')]
          if 'apps/monkeyhub/web/src/MonitorPage.tsx' not in monitor['used_by']:
              monitor['used_by'].append('apps/monkeyhub/web/src/MonitorPage.tsx')
          invariants = []
          for item in monitor.get('invariants', []):
              if item.startswith('Shared asset URLs are an exact allowlist'):
                  continue
              if item.startswith('Standalone serve/report remain available'):
                  invariants.append('Standalone report and API-only serve remain available; both read the same UsageLog/Codex sources as the Hub-owned page')
              else:
                  invariants.append(item)
          browser_invariant = 'MonkeyHub owns the product browser UI; the Monitor process serves only its loopback API and CLI diagnostics. Browser API access is limited to the exact owning Hub loopback origin.'
          if browser_invariant not in invariants:
              invariants.append(browser_invariant)
          monitor['invariants'] = invariants
          monitor['tests'] = [
              item for item in monitor.get('tests', [])
              if item not in {'tests/monkeymonitor/test_web_traces.py', 'tests/monkeymonitor/test_web_timing.py'}
          ]
          if 'apps/monkeyhub/web/test/monitorData.test.ts' not in monitor['tests']:
              monitor['tests'].append('apps/monkeyhub/web/test/monitorData.test.ts')
          if isinstance(monitor.get('notes'), str):
              monitor['notes'] = monitor['notes'].replace('Independent Python package and local UI; no separate architectural authority.', 'Independent Python package and loopback API/CLI; MonkeyHub owns the single product UI. No separate architectural authority.')
          monitor['files'] = [item for item in monitor.get('files', []) if not item.startswith('monkeymonitor/web/')]

          hub = modules['hub.shell']
          usage_owner = 'the visible Usage page and its browser-side presentation of MonkeyMonitor events, traces, explicit diagnostic sources and manual rate estimates; Monitor remains the data/algorithm owner behind the loopback API'
          if usage_owner not in hub['owns']:
              hub['owns'].append(usage_owner)
          for item in (
              'apps/monkeyhub/web/src/MonitorPage.tsx',
              'apps/monkeyhub/web/src/MonitorPage.css',
              'apps/monkeyhub/web/src/monitorData.ts',
          ):
              if item not in hub['files']:
                  hub['files'].append(item)
          if 'apps/monkeyhub/web/test/monitorData.test.ts' not in hub['tests']:
              hub['tests'].append('apps/monkeyhub/web/test/monitorData.test.ts')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          if ! git diff --quiet -- governance/module_registry.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add governance/module_registry.json
            git commit -m "P000-governance prepare rebased GH-128 registry"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/monkeyfab/pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Architecture firewall
        run: python tools/archcheck.py

      - name: Write scopes
        if: github.event_name == 'pull_request'
        run: python tools/archcheck.py --changed origin/${{ github.base_ref || 'main' }}

      - name: Diff whitespace smoke
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      - name: Install project
        run: >-
          python -m pip install -e ".[cad-occt]"
          -e "apps/monkeyfab[send,test]"
          -r apps/archflow-studio/api/requirements.txt
          -r apps/monkeyhub/api/requirements.txt
          httpx2 pytest

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t .

      - name: Fab geometry, CLI and upload boundaries
        run: python -m pytest apps/monkeyfab/tests -q

      - name: Studio API suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest apps/archflow-studio/api/tests -q

      - name: Hub conversation and lifecycle tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s apps/monkeyhub/api/tests

  web:
    name: Studio web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/archflow-studio/web/package-lock.json
            apps/archflow-studio/web/tools/openapi-ts/package-lock.json

      - name: Install API dependencies
        run: >-
          python -m pip install -e .
          -r apps/archflow-studio/api/requirements.txt

      - name: Install web dependencies
        working-directory: apps/archflow-studio/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/archflow-studio/web
        run: npm ci --prefix tools/openapi-ts

      - name: Generated client matches API
        working-directory: apps/archflow-studio/web
        run: npm run api:check

      - name: Typecheck
        working-directory: apps/archflow-studio/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/archflow-studio/web
        run: npm run build

      - name: Install Hub web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Hub web behavior, typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm test && npm run build

  studio:
    name: Studio first-run (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/archflow-studio/web/package-lock.json
            apps/archflow-studio/web/tools/openapi-ts/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -e ".[cad-inspection]" -r apps/archflow-studio/api/requirements.txt httpx2

      - name: API binding, protocol and candidate checks
        working-directory: apps/archflow-studio/api
        run: python -m unittest tests.test_health tests.test_protocol tests.test_candidate

      - name: Install web dependencies
        working-directory: apps/archflow-studio/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/archflow-studio/web
        run: npm ci --prefix tools/openapi-ts

      - name: Web behavior checks
        working-directory: apps/archflow-studio/web
        run: npm test

      - name: Generated client matches API
        working-directory: apps/archflow-studio/web
        run: npm run api:check

      - name: Typecheck and build
        working-directory: apps/archflow-studio/web
        run: npm run build

name: ArchFlow Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The write-scope check reads the commits between the base branch and
      # this head, so it needs the history and the base's remote-tracking ref.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Install project
        run: >-
          python -m pip install -e ".[cad-inspection]"
          -r apps/archflow-studio/api/requirements.txt
          httpx2 pytest

      - name: Architecture firewall
        run: python tools/archcheck.py

      - name: Write scopes
        if: github.event_name == 'pull_request'
        run: python tools/archcheck.py --changed origin/${{ github.base_ref || 'main' }}

      - name: Unit and integration tests
        run: python -m unittest discover -s tests

      - name: Studio API suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest apps/archflow-studio/api/tests -q

  web:
    name: Studio web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # api:check dumps the schema from the FastAPI app before it regenerates
      # the client, so this job needs the API's Python dependencies too.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/archflow-studio/web/package-lock.json
            apps/archflow-studio/web/tools/openapi-ts/package-lock.json

      - name: Install API dependencies
        run: >-
          python -m pip install -e .
          -r apps/archflow-studio/api/requirements.txt

      - name: Install web dependencies
        working-directory: apps/archflow-studio/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/archflow-studio/web
        run: npm ci --prefix tools/openapi-ts

      - name: Generated client matches API
        working-directory: apps/archflow-studio/web
        run: npm run api:check

      - name: Typecheck
        working-directory: apps/archflow-studio/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/archflow-studio/web
        run: npm run build

  studio:
    name: Studio first-run (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/archflow-studio/web/package-lock.json
            apps/archflow-studio/web/tools/openapi-ts/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -e ".[cad-inspection]" -r apps/archflow-studio/api/requirements.txt httpx2

      - name: API binding, protocol and candidate checks
        working-directory: apps/archflow-studio/api
        run: python -m unittest tests.test_health tests.test_protocol tests.test_candidate

      - name: Install web dependencies
        working-directory: apps/archflow-studio/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/archflow-studio/web
        run: npm ci --prefix tools/openapi-ts

      - name: Web behavior checks
        working-directory: apps/archflow-studio/web
        run: npm test

      - name: Generated client matches API
        working-directory: apps/archflow-studio/web
        run: npm run api:check

      - name: Typecheck and build
        working-directory: apps/archflow-studio/web
        run: npm run build

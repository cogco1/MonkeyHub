name: ArchFlow Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: archflow-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Keep enough history for write-scope checks and local/main comparisons.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      # PRs are intentionally smoke-only. Codex/contributors already run the
      # full suites locally; GitHub should cheaply catch architecture/scope/
      # syntax mistakes before merge without duplicating the whole workstation.
      - name: Architecture firewall
        run: python tools/archcheck.py

      - name: Write scopes
        if: github.event_name == 'pull_request'
        run: python tools/archcheck.py --changed origin/${{ github.base_ref || 'main' }}

      - name: Python syntax smoke
        if: github.event_name == 'pull_request'
        run: >-
          python -m compileall -q
          archflow
          apps/archflow-studio/api/archflow_studio_api
          apps/monkeyhub/api/monkeyhub_api

      - name: Diff whitespace smoke
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      # Full clean-machine verification runs once after merge to main, or when
      # explicitly requested with workflow_dispatch.
      - name: Install project
        if: github.event_name != 'pull_request'
        run: >-
          python -m pip install -e ".[cad-occt]"
          -r apps/archflow-studio/api/requirements.txt
          -r apps/monkeyhub/api/requirements.txt
          httpx2 pytest

      - name: Unit and integration tests
        if: github.event_name != 'pull_request'
        run: python -m unittest discover -s tests

      - name: Studio API suite
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest apps/archflow-studio/api/tests -q

      - name: Hub conversation and lifecycle tests
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s apps/monkeyhub/api/tests

  web:
    name: Studio web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/archflow-studio/web/package-lock.json
            apps/archflow-studio/web/tools/openapi-ts/package-lock.json

      - name: Install API dependencies
        run: >-
          python -m pip install -e .
          -r apps/archflow-studio/api/requirements.txt

      - name: Install web dependencies
        working-directory: apps/archflow-studio/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/archflow-studio/web
        run: npm ci --prefix tools/openapi-ts

      - name: Generated client matches API
        working-directory: apps/archflow-studio/web
        run: npm run api:check

      - name: Typecheck
        working-directory: apps/archflow-studio/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/archflow-studio/web
        run: npm run build

      - name: Install Hub web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Hub web behavior, typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm test && npm run build

  studio:
    name: Studio first-run (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/archflow-studio/web/package-lock.json
            apps/archflow-studio/web/tools/openapi-ts/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -e ".[cad-inspection]" -r apps/archflow-studio/api/requirements.txt httpx2

      - name: API binding, protocol and candidate checks
        working-directory: apps/archflow-studio/api
        run: python -m unittest tests.test_health tests.test_protocol tests.test_candidate

      - name: Install web dependencies
        working-directory: apps/archflow-studio/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/archflow-studio/web
        run: npm ci --prefix tools/openapi-ts

      - name: Web behavior checks
        working-directory: apps/archflow-studio/web
        run: npm test

      - name: Generated client matches API
        working-directory: apps/archflow-studio/web
        run: npm run api:check

      - name: Typecheck and build
        working-directory: apps/archflow-studio/web
        run: npm run build

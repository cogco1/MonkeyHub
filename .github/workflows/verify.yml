name: ArchFlow Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Only a pull request supersedes its own earlier run. Pushes to main and manual
# runs each get a unique group, so a newer commit never cancels or queues out a
# full verification that is still pending.
concurrency:
  group: >-
    archflow-verify-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suites run one after another and take 17–20 minutes on a normal
    # runner, so 20 cancelled green runs (GH-425).
    timeout-minutes: 30
    steps:
      # Keep enough history for write-scope checks and local/main comparisons.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            apps/monkeyfab/pyproject.toml
            apps/archflow-studio/api/requirements.txt

      # Every event runs the same verification. The scope and whitespace checks
      # below only have a base to compare against on a pull request.
      - name: Architecture firewall
        run: python tools/archcheck.py

      - name: Write scopes
        if: github.event_name == 'pull_request'
        run: python tools/archcheck.py --changed origin/${{ github.base_ref || 'main' }}

      - name: Diff whitespace smoke
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      # Clean-machine verification: install exactly what the suites below need.
      - name: Install publication fonts
        run: sudo apt-get update && sudo apt-get install --yes fonts-wqy-microhei

      - name: Install project
        run: >-
          python -m pip install -e "packages/archflow[cad-occt]"
          -e packages/monkeyarch
          -e packages/monkeydiagram
          -e packages/monkeymonitor
          -e packages/monkeycontrol
          -e "apps/monkeyfab[send,test]"
          -r apps/archflow-studio/api/requirements.txt
          -r apps/monkeyhub/api/requirements.txt
          httpx2 pytest

      # This job installs every prerequisite its suites check for (PyMuPDF from
      # the Studio requirements), so a missing one fails instead of skipping.
      # Windows-only cases remain platform skips here.
      - name: Unit and integration tests
        env:
          ARCHFLOW_REQUIRE_FULL_ENV: "1"
        run: python -m unittest discover -s tests -t .

      - name: ArchFlow package tests
        run: python -m pytest packages/archflow/tests -q

      - name: MonkeyDiagram package tests
        run: python -m pytest packages/monkeydiagram/tests -q

      - name: MonkeyMonitor package tests
        run: python -m pytest packages/monkeymonitor/tests -q

      - name: MonkeyControl package tests
        run: python -m pytest packages/monkeycontrol/tests -q

      - name: Fab geometry, CLI and upload boundaries
        run: python -m pytest apps/monkeyfab/tests -q

      - name: Studio API suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest apps/archflow-studio/api/tests -q

      - name: Hub conversation and lifecycle tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ARCHFLOW_REQUIRE_FULL_ENV: "1"
        run: python -m unittest discover -s apps/monkeyhub/api/tests

  web:
    name: Hub web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/monkeyhub/web/package-lock.json
            apps/monkeyhub/web/tools/openapi-ts/package-lock.json

      - name: Install API dependencies
        run: >-
          python -m pip install -e packages/archflow -e packages/monkeyarch -e packages/monkeydiagram
          -e packages/monkeymonitor -e packages/monkeycontrol
          -r apps/archflow-studio/api/requirements.txt
          -r apps/monkeyhub/api/requirements.txt

      - name: Install web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/monkeyhub/web
        run: npm ci --prefix tools/openapi-ts

      - name: Generated client matches API
        working-directory: apps/monkeyhub/web
        run: npm run api:check

      - name: Typecheck
        working-directory: apps/monkeyhub/web
        run: npm run typecheck

      - name: Hub web behavior, typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm test && npm run build

      - name: Install browser test dependencies
        id: browser-deps
        working-directory: apps/monkeyhub/web
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chrome

      - name: Project usage browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/chatShell.browser.mjs

      - name: Workspace crash reload browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/errorBoundary.browser.mjs

      - name: Candidate review browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/designTree.browser.mjs

      - name: Drawing browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/drawingCanvas.browser.mjs

      # In-memory API fixtures, no project runtime (#355).
      - name: Board note handoff browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/boardIntentHandoff.browser.mjs

      - name: Intent source browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/intentViewSource.browser.mjs

      - name: Editable model export browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/workModelExport.browser.mjs

      - name: Elevation browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/elevation.browser.mjs

      # Stage interactions against in-memory fixtures, no project API (#355).
      - name: Push/Pull browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/pushPull.browser.mjs

      - name: Scene snapping browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/sceneSnapping.browser.mjs

      - name: Move/Copy gizmo browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/translationGizmo.browser.mjs

      - name: Viewport selection browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/viewportSelection.browser.mjs

  studio:
    name: Hub first-run (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/monkeyhub/web/package-lock.json
            apps/monkeyhub/web/tools/openapi-ts/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -e "packages/archflow[cad-inspection]" -e packages/monkeyarch -e packages/monkeydiagram -e packages/monkeymonitor -e packages/monkeycontrol -r apps/archflow-studio/api/requirements.txt -r apps/monkeyhub/api/requirements.txt httpx2

      - name: Desktop update activation checks
        if: runner.os == 'Windows'
        run: python -m unittest discover -s apps/monkeyhub/api/tests -p test_updates.py -v

      # The directory watch's notified and win32-less scanning tests only run
      # on Windows (GH-388); a skip here would pass silently, so count them.
      - name: Project watch on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, sys, unittest
          suite = unittest.defaultTestLoader.discover("packages/archflow/tests", pattern="test_project_watch.py")
          windows_only = ("NotifiedWatchTests", "ScanningWithoutWin32Tests")
          def ids(s):
              return [i for t in s for i in ids(t)] if isinstance(s, unittest.TestSuite) else [s.id()]
          # Count before running: the runner releases each test once it has run.
          ran_windows_only = sum(i.split(".")[-2] in windows_only for i in ids(suite))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failed = len(result.failures) + len(result.errors)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Project watch on Windows\n\n")
              summary.write(f"run {result.testsRun} (Windows-only {ran_windows_only}), "
                            f"skipped {len(result.skipped)}, failed {failed}\n")
          if not result.wasSuccessful() or result.skipped or ran_windows_only < 20:
              sys.exit(1)

      # Windows refuses to rename a file that is still open, so a corrupt index
      # whose connection leaked could never be quarantined there (GH-418). Both
      # index suites must run in full: a skip or a short count fails the step.
      - name: Project index on Windows
        if: runner.os == 'Windows'
        shell: python
        run: &index-suite |
          import os, sys, unittest
          name = os.environ["INDEX_SUITE"]
          suite = unittest.defaultTestLoader.discover(os.environ["INDEX_START"], pattern=name,
                                                      top_level_dir=os.environ["INDEX_TOP"])
          def ids(s):
              return [i for t in s for i in ids(t)] if isinstance(s, unittest.TestSuite) else [s.id()]
          # Count before running: the runner releases each test once it has run.
          expected = len(ids(suite))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failed = len(result.failures) + len(result.errors)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### {name} on Windows\n\n")
              summary.write(f"run {result.testsRun} of {expected}, "
                            f"skipped {len(result.skipped)}, failed {failed}\n\n")
          if not result.wasSuccessful() or result.skipped or not 0 < expected <= result.testsRun:
              sys.exit(1)
        env:
          INDEX_SUITE: test_project_index.py
          INDEX_START: packages/archflow/tests
          INDEX_TOP: packages/archflow/tests

      - name: Studio indexed reads on Windows
        if: runner.os == 'Windows'
        working-directory: apps/archflow-studio/api
        shell: python
        run: *index-suite
        env:
          INDEX_SUITE: test_indexed_reads.py
          INDEX_START: tests
          INDEX_TOP: .

      - name: API binding, protocol and candidate checks
        working-directory: apps/archflow-studio/api
        run: python -m unittest tests.test_health tests.test_protocol tests.test_candidate

      - name: Install web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/monkeyhub/web
        run: npm ci --prefix tools/openapi-ts

      - name: Web behavior checks
        working-directory: apps/monkeyhub/web
        run: npm test

      - name: Generated client matches API
        working-directory: apps/monkeyhub/web
        run: npm run api:check

      - name: Typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm run build

  # ADR-008 acceptance without the owner's machine (GH-376): the base and this
  # head read one invented project, before and after one review write, and must
  # answer byte for byte alike.
  projection:
    name: Projection check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            apps/archflow-studio/api/requirements.txt

      # A pull request is compared with where it left its base branch; a push
      # to main with the main it replaced.
      - name: Check out the base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          echo "Base $base, candidate $(git rev-parse HEAD)"
          git worktree add "$RUNNER_TEMP/base" "$base"

      - name: Install API and test dependencies
        run: python -m pip install -e "packages/archflow[cad-inspection]" -e packages/monkeyarch -e packages/monkeydiagram -e packages/monkeymonitor -e packages/monkeycontrol -r apps/archflow-studio/api/requirements.txt -r apps/monkeyhub/api/requirements.txt httpx2

      # The base code builds the project: the check promises that an existing
      # project reads the same, and a candidate that deliberately changes what
      # new runs record (GH-429, #402) writes data the base cannot read. A base
      # keeps archflow at its root before #489 and in packages/archflow/src from
      # it on; both are on the path until every base has the packages layout.
      - name: Generate the synthetic project with the base
        shell: bash
        working-directory: ${{ runner.temp }}/base/apps/archflow-studio/api
        env:
          PYTHONPATH: ${{ runner.temp }}/base${{ runner.os == 'Windows' && ';' || ':' }}${{ runner.temp }}/base/packages/archflow/src${{ runner.os == 'Windows' && ';' || ':' }}${{ runner.temp }}/base/apps/archflow-studio/api
        run: >-
          python -c "import os, pathlib, archflow, archflow_studio_api;
          base = pathlib.Path(os.environ['RUNNER_TEMP'], 'base').resolve();
          assert all(pathlib.Path(m.__file__).resolve().is_relative_to(base) for m in (archflow, archflow_studio_api)), 'the base code must build the project';
          from tests.synthetic_project import build_synthetic_project;
          print(build_synthetic_project(pathlib.Path(os.environ['RUNNER_TEMP']) / 'projects'))"

      - name: Projection parity, conditional reads and timings
        shell: bash
        run: >-
          python tools/projection_check.py
          --base "$RUNNER_TEMP/base"
          --candidate "$GITHUB_WORKSPACE"
          --project "$RUNNER_TEMP/projects/synthetic-bench"
          --out "$RUNNER_TEMP/projection/result.json"
          --summary "$RUNNER_TEMP/projection/summary.md"
          --work "$RUNNER_TEMP/projection/work"

      - name: Projection summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/projection/summary.md" ]; then
            cat "$RUNNER_TEMP/projection/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The projection check wrote no summary; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

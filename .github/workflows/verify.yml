name: ArchFlow Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Only a pull request supersedes its own earlier run. Pushes to main and manual
# runs each get a unique group, so a newer commit never cancels or queues out a
# full verification that is still pending.
concurrency:
  group: >-
    archflow-verify-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Keep enough history for write-scope checks and local/main comparisons.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/monkeyfab/pyproject.toml
            apps/archflow-studio/api/requirements.txt

      # Every event runs the same verification. The scope and whitespace checks
      # below only have a base to compare against on a pull request.
      - name: Architecture firewall
        run: python tools/archcheck.py

      - name: Write scopes
        if: github.event_name == 'pull_request'
        run: python tools/archcheck.py --changed origin/${{ github.base_ref || 'main' }}

      - name: Diff whitespace smoke
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      # Clean-machine verification: install exactly what the suites below need.
      - name: Install project
        run: >-
          python -m pip install -e ".[cad-occt]"
          -e "apps/monkeyfab[send,test]"
          -r apps/archflow-studio/api/requirements.txt
          -r apps/monkeyhub/api/requirements.txt
          httpx2 pytest

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t .

      - name: Fab geometry, CLI and upload boundaries
        run: python -m pytest apps/monkeyfab/tests -q

      - name: Studio API suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest apps/archflow-studio/api/tests -q

      - name: Hub conversation and lifecycle tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s apps/monkeyhub/api/tests

  web:
    name: Studio web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/monkeyhub/web/package-lock.json
            apps/monkeyhub/web/workspaces/tools/openapi-ts/package-lock.json

      - name: Install API dependencies
        run: >-
          python -m pip install -e .
          -r apps/archflow-studio/api/requirements.txt
          -r apps/monkeyhub/api/requirements.txt

      - name: Install web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/monkeyhub/web
        run: npm ci --prefix workspaces/tools/openapi-ts

      - name: Generated client matches API
        working-directory: apps/monkeyhub/web
        run: npm run api:check

      - name: Typecheck
        working-directory: apps/monkeyhub/web
        run: npm run typecheck

      - name: Hub web behavior, typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm test && npm run build

  studio:
    name: Studio first-run (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/archflow-studio/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/monkeyhub/web/package-lock.json
            apps/monkeyhub/web/workspaces/tools/openapi-ts/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -e ".[cad-inspection]" -r apps/archflow-studio/api/requirements.txt -r apps/monkeyhub/api/requirements.txt httpx2

      - name: API binding, protocol and candidate checks
        working-directory: apps/archflow-studio/api
        run: python -m unittest tests.test_health tests.test_protocol tests.test_candidate

      - name: Install web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/monkeyhub/web
        run: npm ci --prefix workspaces/tools/openapi-ts

      - name: Web behavior checks
        working-directory: apps/monkeyhub/web
        run: npm test

      - name: Generated client matches API
        working-directory: apps/monkeyhub/web
        run: npm run api:check

      - name: Typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm run build

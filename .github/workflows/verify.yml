name: ArchFlow Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Only a pull request supersedes its own earlier run. Pushes to main and manual
# runs each get a unique group, so a newer commit never cancels or queues out a
# full verification that is still pending.
concurrency:
  group: >-
    archflow-verify-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suites run one after another and take 17–20 minutes on a normal
    # runner, so 20 cancelled green runs (GH-425).
    timeout-minutes: 30
    steps:
      # Keep enough history for write-scope checks and local/main comparisons.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeycad/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            packages/monkeyfab/pyproject.toml
            services/project-runtime/requirements.txt

      # Every event runs the same verification. The scope and whitespace checks
      # below only have a base to compare against on a pull request.
      - name: Architecture firewall
        run: python tools/governance/archcheck.py

      - name: Write scopes
        if: github.event_name == 'pull_request'
        run: python tools/governance/archcheck.py --changed origin/${{ github.base_ref || 'main' }}

      - name: Diff whitespace smoke
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      # Clean-machine verification: install exactly what the suites below need.
      - name: Install publication fonts
        run: sudo apt-get update && sudo apt-get install --yes fonts-wqy-microhei

      - name: Install project
        run: >-
          python -m pip install -e packages/archflow
          -e "packages/monkeycad[occt]"
          -e packages/monkeyarch
          -e packages/monkeydiagram
          -e packages/monkeymonitor
          -e packages/monkeycontrol
          -e "packages/monkeyfab[send,test]"
          -r services/project-runtime/requirements.txt
          -r apps/monkeyhub/api/requirements.txt
          httpx2 pytest

      # The OCCT suites skip themselves when the kernel is missing (occt_available),
      # so a lost extra would pass as a run of skips: fail here instead.
      - name: CAD kernels import
        run: python -c "import OCP, rhino3dm"

      # Each test root runs in its own process: the package and tools suites have
      # no __init__.py, and several roots hold modules of one name.
      # This job installs every prerequisite its suites check for (PyMuPDF from
      # the Runtime requirements), so a missing one fails instead of skipping.
      # Windows-only cases remain platform skips here.
      - name: Integration and packaging tests
        env:
          ARCHFLOW_REQUIRE_FULL_ENV: "1"
        run: python -m unittest discover -s tests -t .

      - name: Repository tool tests
        run: python -m pytest tools/tests -q

      - name: ArchFlow package tests
        run: python -m pytest packages/archflow/tests -q

      - name: MonkeyCAD package tests
        run: python -m pytest packages/monkeycad/tests -q

      - name: MonkeyArch package tests
        run: python -m pytest packages/monkeyarch/tests -q

      - name: MonkeyDiagram package tests
        run: python -m pytest packages/monkeydiagram/tests -q

      - name: MonkeyMonitor package tests
        run: python -m pytest packages/monkeymonitor/tests -q

      - name: MonkeyControl package tests
        run: python -m pytest packages/monkeycontrol/tests -q

      - name: Fab geometry, CLI and upload boundaries
        run: python -m pytest packages/monkeyfab/tests -q

      - name: Project Runtime suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest services/project-runtime/tests -q

      - name: Hub conversation and lifecycle tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ARCHFLOW_REQUIRE_FULL_ENV: "1"
        run: python -m unittest discover -s apps/monkeyhub/api/tests

  web:
    name: Hub web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeycad/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            services/project-runtime/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/monkeyhub/web/package-lock.json
            apps/monkeyhub/web/tools/openapi-ts/package-lock.json

      - name: Install API dependencies
        run: >-
          python -m pip install -e packages/archflow -e "packages/monkeycad[occt]" -e packages/monkeyarch -e packages/monkeydiagram
          -e packages/monkeymonitor -e packages/monkeycontrol
          -r services/project-runtime/requirements.txt
          -r apps/monkeyhub/api/requirements.txt httpx2

      - name: Install web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/monkeyhub/web
        run: npm ci --prefix tools/openapi-ts

      - name: Generated client matches API
        working-directory: apps/monkeyhub/web
        run: npm run api:check

      - name: Typecheck
        working-directory: apps/monkeyhub/web
        run: npm run typecheck

      - name: Hub web behavior, typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm test && npm run build

      - name: Install browser test dependencies
        id: browser-deps
        working-directory: apps/monkeyhub/web
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chrome

      - name: Model history locale browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/versionsLocale.browser.mjs

      - name: Project usage browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/chatShell.browser.mjs

      # Retained public-model suites own disposable real Project Runtimes (#355).
      - name: Install retained-model fixture test dependencies
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        run: python -m pip install -e 'packages/monkeycad[inspection]' 'httpx2>=2.12'

      - name: Retained model working-copy browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/workingCopy.browser.mjs

      - name: Retained model notification browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/versionNotifications.browser.mjs

      - name: Workspace crash reload browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/errorBoundary.browser.mjs

      - name: Candidate review browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/designTree.browser.mjs

      - name: Drawing browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/drawingCanvas.browser.mjs

      - name: Board document page browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/boardDocumentOpen.browser.mjs

      # In-memory API fixtures, no project runtime (#355).
      - name: Board note handoff browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/boardIntentHandoff.browser.mjs

      - name: Board locale browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/boardLocale.browser.mjs

      - name: Board smart alignment browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/boardAlign.browser.mjs

      - name: Intent source browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/intentViewSource.browser.mjs

      - name: Editable model export browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/workModelExport.browser.mjs

      - name: Candidate preview history regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/candidatePreview.browser.mjs

      - name: External model import history regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/externalModelImport.browser.mjs

      - name: Retained model previews history regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/modelPreviews.browser.mjs

      - name: Model recording history regression
        env:
          MONKEYARCH_AUTOSAVE: "1"
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/modelSync.browser.mjs

      - name: Elevation browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/elevation.browser.mjs

      - name: Install Render fixture test dependencies
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        run: python -m pip install -e 'packages/monkeycad[occt]' 'httpx2>=2.12'

      - name: Render workspace browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/renderWorkspace.browser.mjs

      # Stage interactions against in-memory fixtures, no project API (#355).
      - name: Push/Pull browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/pushPull.browser.mjs

      - name: Scene snapping browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/sceneSnapping.browser.mjs

      - name: Move/Copy gizmo browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/translationGizmo.browser.mjs

      - name: Viewport selection browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/viewportSelection.browser.mjs

      - name: Document canvas browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: node test/documentCanvas.browser.mjs

      - name: Publish error recovery browser regression
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        working-directory: apps/monkeyhub/web
        run: |
          python -m pip install 'httpx2>=2.12'
          node test/publishWorkspace.browser.mjs

  hub-first-run:
    name: Hub first-run (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeycad/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            services/project-runtime/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/monkeyhub/web/package-lock.json
            apps/monkeyhub/web/tools/openapi-ts/package-lock.json

      - name: Install API and test dependencies
        run: python -m pip install -e packages/archflow -e "packages/monkeycad[inspection]" -e packages/monkeyarch -e packages/monkeydiagram -e packages/monkeymonitor -e packages/monkeycontrol -r services/project-runtime/requirements.txt -r apps/monkeyhub/api/requirements.txt httpx2

      - name: Desktop update activation checks
        if: runner.os == 'Windows'
        run: python -m unittest discover -s apps/monkeyhub/api/tests -p test_updates.py -v

      # Nothing watches the project (ADR-012): the known layout's tests run in
      # full on Windows, which alone spells an extended-length root (GH-388) and
      # hands out temporary folders by their 8.3 short names. A skip here would
      # pass silently: a skip or a short count fails the step.
      - name: Project watch on Windows
        if: runner.os == 'Windows'
        shell: python
        run: &full-suite |
          import os, sys, unittest
          name = os.environ["SUITE"]
          suite = unittest.defaultTestLoader.discover(os.environ["SUITE_START"], pattern=name,
                                                      top_level_dir=os.environ["SUITE_TOP"])
          def ids(s):
              return [i for t in s for i in ids(t)] if isinstance(s, unittest.TestSuite) else [s.id()]
          # Count before running: the runner releases each test once it has run.
          expected = len(ids(suite))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failed = len(result.failures) + len(result.errors)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### {name} on Windows\n\n")
              summary.write(f"run {result.testsRun} of {expected}, "
                            f"skipped {len(result.skipped)}, failed {failed}\n\n")
          if not result.wasSuccessful() or result.skipped or not 0 < expected <= result.testsRun:
              sys.exit(1)
        env:
          SUITE: test_project_watch.py
          SUITE_START: packages/archflow/tests
          SUITE_TOP: packages/archflow/tests

      # Windows refuses to rename a file that is still open, so a corrupt index
      # whose connection leaked could never be quarantined there (GH-418). Both
      # index suites must run in full: a skip or a short count fails the step.
      - name: Project index on Windows
        if: runner.os == 'Windows'
        shell: python
        run: *full-suite
        env:
          SUITE: test_project_index.py
          SUITE_START: packages/archflow/tests
          SUITE_TOP: packages/archflow/tests

      - name: Runtime indexed reads on Windows
        if: runner.os == 'Windows'
        working-directory: services/project-runtime
        shell: python
        run: *full-suite
        env:
          SUITE: test_indexed_reads.py
          SUITE_START: tests
          SUITE_TOP: .

      - name: API binding, protocol and candidate checks
        working-directory: services/project-runtime
        run: python -m unittest tests.test_health tests.test_protocol tests.test_candidate

      - name: Install web dependencies
        working-directory: apps/monkeyhub/web
        run: npm ci

      - name: Install schema generator
        working-directory: apps/monkeyhub/web
        run: npm ci --prefix tools/openapi-ts

      - name: Web behavior checks
        working-directory: apps/monkeyhub/web
        run: npm test

      - name: Generated client matches API
        working-directory: apps/monkeyhub/web
        run: npm run api:check

      - name: Typecheck and build
        working-directory: apps/monkeyhub/web
        run: npm run build

  # ADR-008 acceptance without the owner's machine (GH-376): the base and this
  # head read one invented project, before and after one review write, and must
  # answer byte for byte alike.
  projection:
    name: Projection check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/archflow/pyproject.toml
            packages/monkeycad/pyproject.toml
            packages/monkeyarch/pyproject.toml
            packages/monkeydiagram/pyproject.toml
            packages/monkeymonitor/pyproject.toml
            packages/monkeycontrol/pyproject.toml
            services/project-runtime/requirements.txt

      # A pull request is compared with where it left its base branch; a push
      # to main with the main it replaced.
      - name: Check out the base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          echo "Base $base, candidate $(git rev-parse HEAD)"
          git worktree add "$RUNNER_TEMP/base" "$base"

      - name: Install API and test dependencies
        run: python -m pip install -e packages/archflow -e "packages/monkeycad[inspection]" -e packages/monkeyarch -e packages/monkeydiagram -e packages/monkeymonitor -e packages/monkeycontrol -r services/project-runtime/requirements.txt -r apps/monkeyhub/api/requirements.txt httpx2

      # The base code builds the project: the check promises that an existing
      # project reads the same, and a candidate that deliberately changes what
      # new runs record (GH-429, #402) writes data the base cannot read. The
      # step runs in the base's runtime directory, whose tests package holds the
      # generator, with the base's archflow and runtime sources on the path. The
      # base's root is on it too: importing project_runtime puts the base's
      # source roots first, and a root not yet on the path would go ahead of the
      # step's directory and shadow that tests package with the root's.
      - name: Generate the synthetic project with the base
        shell: bash
        working-directory: ${{ runner.temp }}/base/services/project-runtime
        env:
          PYTHONPATH: ${{ runner.temp }}/base${{ runner.os == 'Windows' && ';' || ':' }}${{ runner.temp }}/base/packages/archflow/src${{ runner.os == 'Windows' && ';' || ':' }}${{ runner.temp }}/base/services/project-runtime/src
        run: |
          python - <<'PY'
          import os, pathlib, archflow, project_runtime
          base = pathlib.Path(os.environ['RUNNER_TEMP'], 'base').resolve()
          assert all(pathlib.Path(m.__file__).resolve().is_relative_to(base) for m in (archflow, project_runtime)), 'the base code must build the project'
          from tests.synthetic_project import build_synthetic_project
          print(build_synthetic_project(pathlib.Path(os.environ['RUNNER_TEMP']) / 'projects'))
          PY

      - name: Projection parity, conditional reads and timings
        shell: bash
        run: >-
          python tools/benchmarks/projection_check.py
          --base "$RUNNER_TEMP/base"
          --candidate "$GITHUB_WORKSPACE"
          --project "$RUNNER_TEMP/projects/synthetic-bench"
          --out "$RUNNER_TEMP/projection/result.json"
          --summary "$RUNNER_TEMP/projection/summary.md"
          --work "$RUNNER_TEMP/projection/work"

      - name: Projection summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/projection/summary.md" ]; then
            cat "$RUNNER_TEMP/projection/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The projection check wrote no summary; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
